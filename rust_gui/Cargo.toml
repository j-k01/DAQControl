[package]
name = "daq_scope"
version = "0.1.0"
edition = "2021"
description = "Native Rust (egui) control + scope interface for the ZCU102 high-speed DAQ"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
serialport = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }

[profile.release]
opt-level = 3
lto = "thin"
