[package]
name = "denoise_gui"
version = "0.1.0"
edition = "2021"
description = "Native Rust (egui) ensemble de-noising for triggered-burst captures (.npz)"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
rfd = "0.14"                                           # native open/save file dialogs
npyz = "0.8"                                           # parse the .npy members
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
